<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTXForge Studio</title>
<style>
  :root {
    --bg:#f7f7f5; --panel:#ffffff; --ink:#1c1c1a; --muted:#6b6b66; --line:#dcdcd6;
    --accent:#2b6cb0; --warn-bg:#fff4d6; --warn-ink:#6b4a00;
    --c-baseline:#8a8a85; --c-cost:#3b82c4; --c-adv:#d9822b; --c-nb:#2a9d8f; --c-best:#c0392b;
    --code-bg:#f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --panel:#1f1f1d; --ink:#ecece8; --muted:#9a9a93; --line:#34342f;
            --accent:#6aa9e8; --warn-bg:#3a2f10; --warn-ink:#f2d58a; --code-bg:#262623;
            --c-baseline:#9a9a93; --c-cost:#6aa9e8; --c-adv:#f0a24f; --c-nb:#58c4b6; --c-best:#ef6f5e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:14px 16px 6px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  h1 { font-size:18px; margin:0; font-weight:650; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .badge.sim { background:var(--warn-bg); color:var(--warn-ink); border-color:transparent; }
  .badge.real { border-color:var(--c-nb); color:var(--c-nb); }
  #warn { margin:6px 16px; padding:8px 12px; border-radius:8px; background:var(--warn-bg); color:var(--warn-ink); display:none; }
  main { padding:8px 16px 40px; display:grid; gap:14px; max-width:1200px; margin:0 auto; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .kpi .v { font-size:20px; font-weight:650; font-variant-numeric:tabular-nums; }
  .kpi .l { color:var(--muted); font-size:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; min-width:0; }
  .card h2 { margin:0 0 8px; font-size:14px; font-weight:650; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns:1fr; } }
  svg { width:100%; height:auto; display:block; }
  svg text { fill:var(--muted); font-size:11px; font-family:inherit; }
  .axis { stroke:var(--line); } .roof { stroke:var(--ink); stroke-width:1.6; fill:none; }
  .roof2 { stroke:var(--muted); stroke-dasharray:4 3; fill:none; }
  .pt { cursor:pointer; stroke:var(--panel); stroke-width:1; }
  .pt.sel { stroke:var(--ink); stroke-width:2.5; }
  #tip { position:fixed; pointer-events:none; background:var(--ink); color:var(--bg); padding:5px 8px; border-radius:6px;
         font-size:12px; display:none; z-index:5; max-width:260px; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:12px; position:sticky; top:0; background:var(--panel); }
  tr.row { cursor:pointer; } tr.row:hover { background:var(--code-bg); } tr.row.sel { background:var(--code-bg); font-weight:600; }
  .tw { max-height:300px; overflow:auto; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .legend span { margin-right:12px; font-size:12px; color:var(--muted); }
  .panes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  @media (max-width: 980px) { .panes { grid-template-columns:1fr; } }
  pre { margin:0; background:var(--code-bg); padding:10px; border-radius:8px; overflow:auto; max-height:380px;
        font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .pane h3 { margin:0 0 6px; font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  #detail { font-size:13px; } #detail dl { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:0; }
  #detail dt { color:var(--muted); }
  .drop { border:1.5px dashed var(--line); border-radius:10px; padding:26px; text-align:center; color:var(--muted); }
  button, label.btn { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; font:inherit; }
</style>
</head>
<body>
<header>
  <h1>PTXForge Studio</h1>
  <span id="src" class="badge"></span>
  <span id="meta" class="badge"></span>
  <label class="btn">Open trace…<input id="file" type="file" accept=".json" hidden></label>
</header>
<div id="warn"></div>
<main id="main"><div class="drop" id="drop">Drop a <code>trace.json</code> here, or use “Open trace…”.<br>Produce one with <code>ptxforge-tune tune --out trace.json</code>.</div></main>

<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const COL = { baseline:"var(--c-baseline)", "cost-model":"var(--c-cost)", neighbor:"var(--c-nb)", advisor:"var(--c-adv)" };
const colorOf = o => o.startsWith("advisor") ? COL.advisor : (COL[o] || COL["cost-model"]);
const fmt = (x, d=0) => x == null ? "—" : Number(x).toLocaleString(undefined, {maximumFractionDigits:d});
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let T = null, sel = 0;

function load(trace) {
  T = trace; sel = trace.best_index ?? 0;
  const sim = trace.source === "simulated";
  const b = $("#src"); b.textContent = sim ? "SIMULATED — not a measurement" : "measured on GPU"; b.className = "badge " + (sim ? "sim" : "real");
  $("#meta").textContent = `${trace.gpu.name} · ${trace.problem.M}×${trace.problem.N}×${trace.problem.K} · advisor: ${trace.advisor}`;
  const w = $("#warn"); w.style.display = trace.warning ? "block" : "none"; w.textContent = trace.warning || "";
  render();
}

function render() {
  const t = T, ok = t.trials.filter(x => x.ok);
  $("#main").innerHTML = `
    <div class="kpis">
      ${kpi("Baseline (untuned)", fmt(t.baseline_gflops) + " GF/s")}
      ${kpi("Best found", fmt(t.best_gflops) + " GF/s")}
      ${kpi("Speedup vs baseline", t.speedup_vs_default ? "×" + t.speedup_vs_default : "—")}
      ${kpi("% of cuBLAS SGEMM", t.pct_of_cublas != null ? t.pct_of_cublas + "%" : "n/a")}
      ${kpi("Cost-model rank corr.", t.model_spearman != null ? t.model_spearman.toFixed(2) : "—")}
      ${kpi("Trials / space", `${t.trials.length} / ${fmt(t.space_size)}`)}
    </div>
    <div class="grid2">
      <div class="card"><h2>Roofline <span class="legend">${legend()}</span></h2><div id="roof"></div></div>
      <div class="card"><h2>Convergence (best-so-far)</h2><div id="conv"></div></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>Trials</h2><div class="tw"><table id="tbl"></table></div></div>
      <div class="card"><h2>Selected trial</h2><div id="detail"></div></div>
    </div>
    <div class="card"><h2>IR stages for the best configuration</h2><div class="panes" id="panes"></div></div>`;
  drawRoof(); drawConv(); drawTable(); drawDetail(); drawPanes();
}
const kpi = (l, v) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
const legend = () => [["baseline","baseline"],["cost-model","cost model"],["advisor","advisor"],["neighbor","neighbor"]]
  .map(([k,n]) => `<span><i class="dot" style="background:${COL[k]}"></i>${n}</span>`).join("");

function drawRoof() {
  const g = T.gpu, W = 560, H = 360, m = {l:54, r:14, t:12, b:40};
  const xmin = 1, xmax = 512, ymin = 50, ymax = g.peak_gflops * 1.6;
  const lx = x => m.l + (Math.log10(x) - Math.log10(xmin)) / (Math.log10(xmax) - Math.log10(xmin)) * (W - m.l - m.r);
  const ly = y => H - m.b - (Math.log10(y) - Math.log10(ymin)) / (Math.log10(ymax) - Math.log10(ymin)) * (H - m.t - m.b);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Roofline plot">`;
  for (const x of [1,2,4,8,16,32,64,128,256,512]) s += `<line class="axis" x1="${lx(x)}" x2="${lx(x)}" y1="${m.t}" y2="${H-m.b}" opacity=".35"/><text x="${lx(x)}" y="${H-m.b+14}" text-anchor="middle">${x}</text>`;
  for (const y of [100,300,1000,3000,10000,30000]) if (y < ymax) s += `<line class="axis" x1="${m.l}" x2="${W-m.r}" y1="${ly(y)}" y2="${ly(y)}" opacity=".35"/><text x="${m.l-6}" y="${ly(y)+4}" text-anchor="end">${y>=1000?y/1000+"k":y}</text>`;
  s += `<text x="${(W+m.l)/2}" y="${H-6}" text-anchor="middle">arithmetic intensity (FLOP/byte, modeled from tiling traffic)</text>`;
  s += `<text transform="translate(12 ${H/2}) rotate(-90)" text-anchor="middle">GFLOP/s</text>`;
  const ridge = g.peak_gflops / g.bw_gbs, sus = g.peak_gflops * g.sustained;
  s += `<path class="roof" d="M${lx(xmin)} ${ly(g.bw_gbs*xmin)} L${lx(ridge)} ${ly(g.peak_gflops)} L${lx(xmax)} ${ly(g.peak_gflops)}"/>`;
  s += `<path class="roof2" d="M${lx(sus/g.bw_gbs)} ${ly(sus)} L${lx(xmax)} ${ly(sus)}"/>`;
  s += `<text x="${lx(xmax)-4}" y="${ly(g.peak_gflops)-5}" text-anchor="end">datasheet FP32 peak ${fmt(g.peak_gflops)}</text>`;
  s += `<text x="${lx(xmax)-4}" y="${ly(sus)+13}" text-anchor="end">assumed sustained ${fmt(sus)}</text>`;
  s += `<text x="${lx(ridge)+4}" y="${ly(g.peak_gflops)+14}">ridge ${ridge.toFixed(1)}</text>`;
  // incumbent trajectory
  let best = -1, path = [];
  T.trials.forEach(t => { if (t.ok && t.gflops > best) { best = t.gflops; path.push(t); } });
  if (path.length > 1) s += `<polyline fill="none" stroke="var(--c-best)" stroke-width="1.4" opacity=".6" points="${path.map(t => lx(t.modeled.ai)+","+ly(t.gflops)).join(" ")}"/>`;
  T.trials.forEach(t => { if (!t.ok) return;
    const r = t.i === T.best_index ? 7 : 5;
    s += `<circle class="pt ${t.i===sel?"sel":""}" data-i="${t.i}" cx="${lx(t.modeled.ai)}" cy="${ly(t.gflops)}" r="${r}" fill="${colorOf(t.origin)}"/>`; });
  $("#roof").innerHTML = s + "</svg>";
  $("#roof").querySelectorAll(".pt").forEach(el => wire(el));
}

function drawConv() {
  const W = 560, H = 260, m = {l:54, r:14, t:12, b:34}, n = T.trials.length;
  const ys = T.trials.filter(t => t.ok).map(t => t.gflops), ymax = Math.max(...ys) * 1.08, ymin = 0;
  const lx = i => m.l + i / Math.max(1, n - 1) * (W - m.l - m.r), ly = y => H - m.b - (y - ymin) / (ymax - ymin) * (H - m.t - m.b);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Convergence plot">`;
  for (let k = 0; k <= 4; k++) { const y = ymax * k / 4; s += `<line class="axis" x1="${m.l}" x2="${W-m.r}" y1="${ly(y)}" y2="${ly(y)}" opacity=".35"/><text x="${m.l-6}" y="${ly(y)+4}" text-anchor="end">${fmt(y)}</text>`; }
  s += `<text x="${(W+m.l)/2}" y="${H-6}" text-anchor="middle">trial #</text>`;
  let best = 0, pts = [];
  T.trials.forEach((t, i) => { if (t.ok) best = Math.max(best, t.gflops); pts.push(`${lx(i)},${ly(best)}`); });
  s += `<polyline fill="none" stroke="var(--c-best)" stroke-width="2" points="${pts.join(" ")}"/>`;
  T.trials.forEach((t, i) => { if (t.ok) s += `<circle class="pt ${i===sel?"sel":""}" data-i="${i}" cx="${lx(i)}" cy="${ly(t.gflops)}" r="3.5" fill="${colorOf(t.origin)}"/>`; });
  if (T.cublas_gflops) s += `<line x1="${m.l}" x2="${W-m.r}" y1="${ly(T.cublas_gflops)}" y2="${ly(T.cublas_gflops)}" stroke="var(--c-nb)" stroke-dasharray="5 3"/><text x="${W-m.r-4}" y="${ly(T.cublas_gflops)-5}" text-anchor="end">cuBLAS SGEMM</text>`;
  $("#conv").innerHTML = s + "</svg>";
  $("#conv").querySelectorAll(".pt").forEach(el => wire(el));
}

function wire(el) {
  const i = +el.dataset.i, tip = $("#tip");
  el.addEventListener("mousemove", e => { const t = T.trials[i];
    tip.style.display = "block"; tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px";
    tip.innerHTML = `#${t.i} ${esc(shortCfg(t.cfg))}<br>${fmt(t.gflops)} GFLOP/s · ${esc(t.origin)}`; });
  el.addEventListener("mouseleave", () => tip.style.display = "none");
  el.addEventListener("click", () => { sel = i; drawRoof(); drawConv(); drawTable(); drawDetail(); });
}
const shortCfg = c => `${c.BM}x${c.BN}x${c.BK} t${c.TM}x${c.TN} pad${c.PAD}`;

function drawTable() {
  let h = `<tr><th>#</th><th>config</th><th>origin</th><th>GFLOP/s</th><th>symptoms</th></tr>`;
  T.trials.forEach(t => h += `<tr class="row ${t.i===sel?"sel":""}" data-i="${t.i}"><td>${t.i}${t.i===T.best_index?" ★":""}</td><td>${esc(shortCfg(t.cfg))}</td>
    <td><i class="dot" style="background:${colorOf(t.origin)}"></i>${esc(t.origin)}</td><td>${t.ok?fmt(t.gflops):"failed"}</td><td>${esc((t.symptoms||[]).join(", ")||"—")}</td></tr>`);
  const tb = $("#tbl"); tb.innerHTML = h;
  tb.querySelectorAll(".row").forEach(r => r.addEventListener("click", () => { sel = +r.dataset.i; drawRoof(); drawConv(); drawTable(); drawDetail(); }));
}

function drawDetail() {
  const t = T.trials[sel], p = t.profile || {}, m = t.modeled || {};
  const row = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
  $("#detail").innerHTML = `<dl>
    ${row("config", esc(shortCfg(t.cfg)) + ` · ${t.cfg.threads} threads · ${fmt(t.cfg.smem_bytes)} B smem`)}
    ${row("why this trial", esc(t.why || "—"))}
    ${row("result", t.ok ? `${fmt(t.gflops,1)} GFLOP/s · ${fmt(t.ms,3)} ms` : "FAILED: " + esc(t.error || ""))}
    ${row("measured regs / spill bytes", `${p.regs ?? "—"} / ${p.local_bytes ?? "—"}`)}
    ${row("occupancy / blocks per SM", `${p.occupancy ?? "—"} / ${p.blocks_per_sm ?? "—"}`)}
    ${row("modeled AI (FLOP/B)", m.ai != null ? m.ai.toFixed(1) + (m.memory_bound ? " · memory-bound" : " · compute-bound") : "—")}
    ${row("modeled bank conflicts", m.bank ? `store ${m.bank.store_As}-way · read A ${m.bank.read_As}-way · read B ${m.bank.read_Bs}-way` : "—")}
    ${row("modeled prediction", m.predicted_gflops != null ? fmt(m.predicted_gflops) + " GFLOP/s (prior, not a measurement)" : "—")}
    ${row("symptoms", esc((t.symptoms||[]).join(", ") || "none"))}
  </dl>`;
}

function drawPanes() {
  const st = T.stages || [];
  $("#panes").innerHTML = st.length ? st.map(s => `<div class="pane"><h3>${esc(s.name)}</h3><pre>${esc(s.text)}</pre></div>`).join("")
    : "<div class='drop'>No IR stages in this trace.</div>";
}

// ---- loading -------------------------------------------------------------
$("#file").addEventListener("change", e => e.target.files[0] && e.target.files[0].text().then(x => load(JSON.parse(x))));
const drop = document.body;
drop.addEventListener("dragover", e => e.preventDefault());
drop.addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) f.text().then(x => load(JSON.parse(x))); });
(async function boot() {
  const emb = JSON.parse($("#embedded").textContent);
  if (emb) return load(emb);
  for (const u of ["trace.json", "sample_trace.json"]) {
    try { const r = await fetch(u); if (r.ok) return load(await r.json()); } catch (_) {}
  }
})();
</script>
</body>
</html>
